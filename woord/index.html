tails><footer>Dein Fortschritt wird lokal in diesem Browser gespeichert. Jeder lernt mit seinem eigenen Fortschritt. Die Vokabeln wurden aus den fett gedruckten Einträgen deiner vier Fotos übertragen; gleiche Wörter wurden zusammengeführt.</footer>`;

function list(){app.innerHTML=`<button class="ghost" onclick="home()">Zur Übersicht</button><h1>Deine Vokabeln</h1><p class="muted">${pool().length} Einträge • nur der übertragene Fetttext</p><input id="search" placeholder="Wort suchen" aria-label="Wort suchen"><div class="card" id="words"></div>`;let render=()=>{let q=norm(document.getElementById('search').value);document.getElementById('words').innerHTML=pool().filter(w=>norm(w.nl+' '+w.de.join(' ')).includes(q)).map(w=>`<div class="word"><b>${esc(w.nl)}</b><span>${esc(w.de.join(' / '))}</span></div>`).join('')||'<p>Keine Treffer.</p>'};document.getElementById('search').oninput=render;render()}
</script><script>const GRAMMAR_TOPICS=[
{id:'pronouns',title:'Personalpronomen',subtitle:'Wer handelt? Wen betrifft es?',body:`<p>Ein Pronomen ersetzt einen Namen oder ein Nomen. Zuerst entscheidest du: Ist die Person das <b>Subjekt</b> (wer handelt?) oder das <b>Objekt</b> (wen/wem betrifft es)?</p><div class="tablewrap"><table><tr><th>Deutsch</th><th>Subjekt</th><th>Objekt</th></tr><tr><td>ich / mich, mir</td><td>ik</td><td>mij / me</td></tr><tr><td>du / dich, dir</td><td>jij / je</td><td>jou / je</td></tr><tr><td>Sie (höflich)</td><td>u</td><td>u</td></tr><tr><td>er / ihn, ihm</td><td>hij</td><td>hem</td></tr><tr><td>sie (eine Frau)</td><td>zij / ze</td><td>haar</td></tr><tr><td>es</td><td>het</td><td>het</td></tr><tr><td>wir / uns</td><td>wij / we</td><td>ons</td></tr><tr><td>ihr / euch</td><td>jullie</td><td>jullie</td></tr><tr><td>sie (mehrere)</td><td>zij / ze</td><td>hen / hun / ze</td></tr></table></div><p><b>Hij ziet mij.</b> = Er sieht mich. <b>Hij</b> handelt; <b>mij</b> wird gesehen. Nach einer Präposition verwendest du eine Objektform: <b>met jou</b> = mit dir.</p><p><b>jij/je, wij/we, zij/ze:</b> Die langen Formen können betonen. „Jij!“ = gerade du. Die kurzen Formen sind im normalen Satz oft unbetont.</p><p><b>zij/ze</b> bedeutet „sie“ im Singular und Plural. Das Verb hilft: <b>ze is</b> = sie ist; <b>ze zijn</b> = sie sind.</p><details><summary>hen oder hun?</summary><p>Die klassische Schulregel für mehrere Personen: <b>hen</b> als direktes Objekt und nach einer Präposition; <b>hun</b> als indirektes Objekt ohne Präposition. <b>Ik zie hen.</b> = Ich sehe sie. <b>Ik geef hun het boek.</b> = Ich gebe ihnen das Buch. Unbetont ist oft <b>ze</b> möglich. Als Subjekt lernst du <b>zij/ze</b>.</p></details>`},
{id:'verbs',title:'Verben im Präsens',subtitle:'Stamm bilden und die Person beachten',body:`<p>Der <b>Infinitiv</b> ist die Grundform: <b>werken</b> = arbeiten. Der <b>Stamm</b> ist bei regelmäßigen Verben die ik-Form: <b>werk</b>.</p><ol><li><b>-en</b> wegnehmen: werken → werk.</li><li>Wenn nötig die Schreibweise anpassen: wonen → <b>woon</b>, zitten → <b>zit</b>, schrijven → <b>schrijf</b>, lezen → <b>lees</b>.</li><li>Die Endung passend zur Person wählen.</li></ol><div class="tablewrap"><table><tr><th>Person</th><th>Regel</th><th>Beispiel</th></tr><tr><td>ik</td><td>Stamm</td><td>ik werk</td></tr><tr><td>jij / je / u</td><td>Stamm + t</td><td>jij werkt</td></tr><tr><td>hij / zij / ze / het</td><td>Stamm + t</td><td>hij werkt</td></tr><tr><td>wij / we</td><td>Grundform</td><td>wij werken</td></tr><tr><td>jullie</td><td>Grundform</td><td>jullie werken</td></tr><tr><td>zij / ze (mehrere)</td><td>Grundform</td><td>zij werken</td></tr></table></div><p><b>Stamm endet schon auf t:</b> keine zweite t anhängen. zitten → ik zit → hij zit.</p><p><b>Stamm endet auf d:</b> t trotzdem anhängen. antwoorden → ik antwoord → hij antwoordt.</p><p><b>Verb vor jij/je:</b> Das Endungs-t fällt weg: jij werkt → <b>werk jij?</b> Bei <b>u</b> bleibt es: <b>werkt u?</b> Ein t, das schon zum Stamm gehört, bleibt: <b>zit jij?</b></p><details><summary>Schreibweise des Stamms</summary><p>Ein langer Vokal braucht in einer geschlossenen Silbe oft zwei Buchstaben: wonen → woon, maken → maak, leren → leer. Ein kurzer Vokal bleibt kurz: zitten → zit, spellen → spel. Am Wortende wird v meist f und z meist s: schrijven → schrijf; lezen → lees. Lerne Ausnahmen mit: <b>komen → kom</b>.</p></details>`},
{id:'irregular',title:'zijn, hebben und weitere Verben',subtitle:'Wichtige Formen auswendig können',body:`<p><b>zijn</b> (sein) und <b>hebben</b> (haben) musst du extra lernen.</p><div class="tablewrap"><table><tr><th>Person</th><th>zijn</th><th>hebben</th></tr><tr><td>ik</td><td>ben</td><td>heb</td></tr><tr><td>jij / je</td><td>bent</td><td>hebt</td></tr><tr><td>u</td><td>bent</td><td>hebt / heeft</td></tr><tr><td>hij / zij / het</td><td>is</td><td>heeft</td></tr><tr><td>wij / jullie / zij</td><td>zijn</td><td>hebben</td></tr></table></div><p>Bei Verb vor jij/je: <b>ben jij?</b> und <b>heb je?</b> Bei u: <b>bent u?</b> und <b>hebt/heeft u?</b></p><div class="tablewrap"><table><tr><th>Grundform</th><th>ik</th><th>jij</th><th>hij</th><th>wir/ihr/sie</th></tr><tr><td>gaan</td><td>ga</td><td>gaat</td><td>gaat</td><td>gaan</td></tr><tr><td>doen</td><td>doe</td><td>doet</td><td>doet</td><td>doen</td></tr><tr><td>zien</td><td>zie</td><td>ziet</td><td>ziet</td><td>zien</td></tr><tr><td>kunnen</td><td>kan</td><td>kunt / kan</td><td>kan</td><td>kunnen</td></tr><tr><td>willen</td><td>wil</td><td>wilt / wil</td><td>wil</td><td>willen</td></tr><tr><td>mogen</td><td>mag</td><td>mag</td><td>mag</td><td>mogen</td></tr></table></div><p><b>hij wil</b> und <b>hij kan</b> haben kein t. Vor jij/je: <b>ga jij, doe jij, zie jij, kun jij, wil jij, mag jij</b>.</p><p>Mit einem zweiten Verb bleibt dieses in der Grundform und steht in einfachen Hauptsätzen am Ende: <b>Ik wil Nederlands leren.</b> = Ich will Niederländisch lernen.</p>`},
{id:'plural',title:'Mehrzahl und Artikel',subtitle:'-en, -s und veränderte Schreibweisen',body:`<p>Nomen haben häufig eine Mehrzahl auf <b>-en</b> oder <b>-s</b>. Die Form lernst du am besten mit dem Wort.</p><div class="tablewrap"><table><tr><th>Muster</th><th>Einzahl → Mehrzahl</th></tr><tr><td>-en</td><td>de fiets → de fietsen<br>het boek → de boeken</td></tr><tr><td>kurzer Vokal bleibt kurz</td><td>de pen → de pennen<br>de les → de lessen</td></tr><tr><td>langer Vokal bleibt lang</td><td>het raam → de ramen<br>de maan → de manen</td></tr><tr><td>oft -s</td><td>de tafel → de tafels<br>de docent → de docenten (mitlernen!)</td></tr><tr><td>Apostroph + s</td><td>de auto → de auto's<br>de foto → de foto's<br>de baby → de baby's</td></tr><tr><td>Ausnahmen</td><td>het kind → de kinderen<br>de stad → de steden<br>de koe → de koeien</td></tr></table></div><p>Das Apostroph in <b>auto's</b> schützt die Aussprache des Schlussvokals. Nicht wahllos vor jedes s setzen: <b>tafels, kopjes</b>.</p><p><b>de/het:</b> In der Einzahl gehört der Artikel zum Wort. In der Mehrzahl steht bei bestimmten Nomen immer <b>de</b>: <b>het huis → de huizen</b>. <b>een</b> bedeutet ein/eine; als unbestimmte Mehrzahl kann der Artikel wegfallen: <b>een boek → boeken</b>.</p><p>Die Schreibweise kann sich ändern: huis → huizen; brief → brieven. Nicht jede f oder s verändert sich: <b>fiets → fietsen</b>.</p>`},
{id:'sentences',title:'Sätze und Fragen',subtitle:'Verbposition und jij ohne Endungs-t',body:`<p>Im einfachen Aussagesatz steht das gebeugte Verb auf der <b>zweiten Satzgliedposition</b>. Das ist nicht unbedingt das zweite Wort.</p><p><b>Ik woon in Nederland.</b><br>Ich wohne in den Niederlanden.</p><p>Steht etwas anderes vorne, folgt das Subjekt hinter dem Verb:<br><b>In Nederland woon ik.</b><br><b>Nu werk jij.</b> = Jetzt arbeitest du.</p><p><b>Ja/Nein-Frage:</b> Verb + Subjekt + Rest.<br><b>Werk jij?</b> = Arbeitest du?<br><b>Woont hij in Nederland?</b></p><p><b>Frage mit Fragewort:</b> Fragewort + Verb + Subjekt.<br><b>Waar woon jij?</b> = Wo wohnst du?<br><b>Hoe heet je?</b> = Wie heißt du?</p><p>Bei jij/je hinter dem Verb fällt nur das <b>angehängte</b> t weg. <b>Jij zit → Zit jij?</b> (Stamm zit bleibt). Bei hij und u bleibt die normale Form: <b>Woont hij?</b>, <b>Woont u?</b></p>`},
{id:'possessive',title:'mein, dein, unser',subtitle:'Besitz ausdrücken',body:`<p>Ein <b>Possessivpronomen</b> zeigt, wem etwas gehört. Es steht vor dem Nomen: <b>mijn fiets</b> = mein Fahrrad.</p><div class="tablewrap"><table><tr><th>Deutsch</th><th>Niederländisch</th></tr><tr><td>mein</td><td>mijn</td></tr><tr><td>dein</td><td>jouw / je</td></tr><tr><td>Ihr (höflich)</td><td>uw</td></tr><tr><td>sein</td><td>zijn</td></tr><tr><td>ihr (eine Frau)</td><td>haar</td></tr><tr><td>unser</td><td>ons / onze</td></tr><tr><td>euer</td><td>jullie</td></tr><tr><td>ihr (mehrere Personen)</td><td>hun</td></tr></table></div><p><b>ons</b> vor het-Wörtern im Singular: <b>ons huis</b>. <b>onze</b> vor de-Wörtern und im Plural: <b>onze fiets, onze huizen</b>.</p><p>Unterscheide <b>jou</b> = dich/dir und <b>jouw</b> = dein: <b>Ik zie jou.</b> / <b>Dit is jouw fiets.</b></p>`}
];

function prepHome(){session=null;let due=PREP.filter(q=>gGet(q).seen&&gGet(q).due<=Date.now()).length,secure=PREP.filter(q=>gGet(q).level>=3).length;app.innerHTML=`${modeNav('prep')}<span class="tag" style="margin-top:20px">DEINE BLÄTTER · MORGEN</span><h1>Arbeitsvorbereitung</h1><p class="muted">Übungen nach den gedruckten Aufgaben deiner fünf Bilder. Handschriftliche Lösungen wurden ignoriert.</p><div class="stats"><div><b>${PREP.length}</b><small>Aufgaben</small></div><div><b>${due}</b><small>fällig</small></div><div><b>${secure}</b><small>gefestigt</small></div></div><div class="card"><h2>Für heute</h2><p class="muted">Übe erst Verben, Pronomen und Mehrzahl. Danach Zahlen, Sätze und die übrigen Aufgaben. Der Probetest mischt alle Themen und zeigt Lösungen erst am Ende.</p><button class="wide" onclick="pStart('all','exam')">Probetest · 36 Aufgaben</button><div class="row" style="margin-top:12px"><button class="secondary" onclick="pStart('all','learn')">Gemischt üben</button><button class="secondary" onclick="pStart('all','errors')">Fehler üben</button></div></div><button class="wide secondary" onclick="introWrite()">Sich vorstellen: eigenen Text schreiben</button>${PREP_TOPICS.map(t=>{let p=PREP.filter(q=>q.topic===t.id),done=p.filter(q=>gGet(q).level>=3).length;return `<div class="card"><h2>${esc(t.title)}</h2><p class="muted">${esc(t.subtitle)} · ${done}/${p.length} gefestigt</p><button class="wide" onclick="pStart('${t.id}','learn')">Dieses Thema üben</button></div>`}).join('')}<footer>Vokabeln, Grammatik und Arbeitsvorbereitung speichern ihren Fortschritt getrennt. Beim Zuordnen und bei der Rechtschreibung wählst du Antworten; Verben, Zahlen und Formen schreibst du selbst.</footer>`;window.scrollTo(0,0)}
function pStart(topic,mode){let p=PREP.filter(q=>topic==='all'||q.topic===topic),items;
if(mode==='exam')items=topic==='all'?shuffle(PREP_TOPICS.flatMap(t=>shuffle(PREP.filter(q=>q.topic===t.id)).slice(0,3))):shuffle(p).slice(0,30);
else if(mode==='errors')items=shuffle(p.filter(q=>gGet(q).errors&&gGet(q).level<3)).slice(0,15);
else{let due=shuffle(p.filter(q=>gGet(q).seen&&gGet(q).due<=Date.now())).slice(0,15);let fresh=shuffle(p.filter(q=>!gGet(q).seen)).slice(0,15-due.length);items=[...due,...fresh];if(!items.length)items=shuffle(p).sort((a,b)=>gGet(a).level-gGet(b).level).slice(0,15)}
if(!items.length){app.innerHTML=`<div class="card"><h2>Keine unsicheren Fehler in diesem Bereich.</h2><button onclick="prepHome()">Zur Arbeitsvorbereitung</button></div>`;return}
session={kind:'grammar',domain:'prep',topic,mode,q:items,index:0,answers:[],help:false,graded:false,started:Date.now(),max:mode==='exam'?items.length:Math.min(items.length*3,45)};gShow()}
