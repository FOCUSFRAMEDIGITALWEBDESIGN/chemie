const app=document.getElementById('app');
const STORAGE_KEY='woord-fotoliste-v1';
let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||{cards:{},sessions:0}}catch(e){state={cards:{},sessions:0}}
state.cards=state.cards||{};state.sessions=state.sessions||0;
const GROUPS=['Alle',...new Set(WORDS.map(w=>w.group))];
let group='Alle',direction='nl',session=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFC').replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
function save(){let s=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,s)}
const key=(w,d)=>w.nl+':'+d, get=(w,d)=>state.cards[key(w,d)]||{level:0,due:0,errors:0,seen:0};
function pool(){return WORDS.filter(w=>group==='Alle'||w.group===group)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function home(){session=null;let p=pool(),due=p.filter(w=>get(w,direction).seen&&get(w,direction).due<=Date.now()).length,secure=p.filter(w=>get(w,direction).level>=3).length;
app.innerHTML=`<span class="tag">VOKABELLISTE</span><h1>Niederländisch üben</h1><p class="muted">Kurze Runden. Erst selbst antworten, dann vergleichen. Artikel gehören dazu.</p><div class="stats"><div><b>${p.length}</b><small>Vokabeln</small></div><div><b>${due}</b><small>fällig</small></div><div><b>${secure}</b><small>gefestigt</small></div></div><div class="card"><label for="group">Lernstoff</label><select id="group">${GROUPS.map(x=>`<option ${group===x?'selected':''}>${x}</option>`).join('')}</select><label for="direction">Abfragerichtung</label><select id="direction"><option value="nl" ${direction==='nl'?'selected':''}>Deutsch → Niederländisch</option><option value="de" ${direction==='de'?'selected':''}>Niederländisch → Deutsch</option></select><button class="wide" onclick="start('learn')">Lernrunde starten</button><p class="muted"><small>Bis zu 10 neue Wörter + fällige Wiederholungen. Fehler kommen nach anderen Fragen erneut.</small></p><div class="row"><button class="secondary" onclick="start('errors')">Fehler üben</button><button class="secondary" onclick="start('exam')">${p.length>=30?'30er Test':'Test starten'}</button></div></div><button class="ghost" onclick="list()">Alle Vokabeln ansehen</button><footer>Alle Vokabeln stammen aus dem Foto. Dein Fortschritt wird lokal in diesem Browser gespeichert.</footer>`;
document.getElementById('group').onchange=e=>{group=e.target.value;home()};document.getElementById('direction').onchange=e=>{direction=e.target.value;home()};}
function start(mode){let p=pool(),items;
if(mode==='exam')items=shuffle(p).slice(0,30);
else if(mode==='errors')items=shuffle(p.filter(w=>get(w,direction).errors>0&&get(w,direction).level<3)).slice(0,20);
else{let due=shuffle(p.filter(w=>get(w,direction).seen&&get(w,direction).due<=Date.now())).slice(0,20);let fresh=p.filter(w=>!get(w,direction).seen).slice(0,10);items=[...due,...fresh]}
if(!items.length){app.innerHTML=`<div class="card"><h2>${mode==='errors'?'Keine unsicheren Fehler.':'Alles für jetzt erledigt.'}</h2><p class="muted">${mode==='errors'?'Starte eine Lernrunde oder prüfe dich mit dem Test.':'Mach später mit den fälligen Wiederholungen weiter oder nutze jetzt den Test.'}</p><button onclick="home()">Zur Übersicht</button></div>`;return}
session={mode,q:items.map(w=>({w,intro:mode==='learn'&&!get(w,direction).seen})),index:0,answers:[],help:false,started:Date.now(),max:Math.min(items.length*3,60),graded:false};show()}
function targets(w){return direction==='de'?w.de:[w.nl]}
function show(){let s=session;if(s.index>=s.q.length||s.index>=s.max)return finish();s.help=false;s.graded=false;let item=s.q[s.index],w=item.w;let prompt=direction==='nl'?w.de.join(' / '):w.nl;
if(direction==='nl'&&w.nl==='eten')prompt+=' (Verb)';
if(direction==='nl'&&w.nl==='het eten')prompt+=' (Nomen)';
app.innerHTML=`<button class="ghost" onclick="leave()">Runde beenden</button><div class="row"><small>${s.mode==='exam'?'TEST':s.mode==='errors'?'FEHLER ÜBEN':'LERNRUNDE'}</small><small>${s.index+1} / ${Math.min(s.q.length,s.max)}</small></div><progress value="${s.index}" max="${Math.min(s.q.length,s.max)}"></progress><div class="card"><span class="tag">${esc(w.group)}</span>${item.intro?`<h2>Neues Wort</h2><div class="prompt">${esc(w.nl)}</div><p class="muted">${esc(w.de.join(' / '))}</p><p class="muted">Lies das Wort und sprich es einmal laut. Gleich fragst du es aus dem Kopf ab.</p><button class="wide" onclick="ready()">Jetzt abfragen</button>`:`<p class="muted">${direction==='nl'?'Schreibe auf Niederländisch.':'Schreibe eine deutsche Bedeutung.'}</p><div class="prompt">${esc(prompt)}</div><form id="form"><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Deine Übersetzung" placeholder="Deine Antwort"><button class="wide" id="check">Prüfen</button></form><div id="feedback" aria-live="polite"></div>${s.mode!=='exam'?'<button class="ghost" id="hint" onclick="hint()">Lösung zeigen</button>':''}`}</div>`;
if(!item.intro){document.getElementById('form').onsubmit=e=>{e.preventDefault();grade()};}}
function ready(){session.q[session.index].intro=false;show()}
function hint(){if(session.graded)return;session.help=true;document.getElementById('feedback').innerHTML=`<div class="feedback">${esc(targets(session.q[session.index].w).join(' / '))}<br><small>Mit Hilfe zählt diese Antwort als Wiederholung.</small></div>`;document.getElementById('hint').disabled=true}
function grade(){let s=session;if(s.graded)return;let w=s.q[s.index].w,answer=document.getElementById('answer').value;if(!answer.trim()&&!s.help){document.getElementById('answer').focus();return}s.graded=true;let ok=!s.help&&targets(w).some(t=>norm(t)===norm(answer));
// Identical translations such as Bier and Schnaps can have two Dutch entries.
if(direction==='nl'&&!s.help){
  ok=WORDS.some(x=>x.de.some(v=>w.de.includes(v))&&norm(x.nl)===norm(answer));
}
s.answers.push({w,answer,ok,help:s.help});if(s.mode!=='exam')update(w,ok);
if(!ok&&s.mode!=='exam'&&s.q.length<s.max)s.q.splice(Math.min(s.index+4,s.q.length),0,{w,intro:false});
document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true;if(document.getElementById('hint'))document.getElementById('hint').disabled=true;
document.getElementById('feedback').innerHTML=s.mode==='exam'?`<button class="wide secondary" onclick="next()">Weiter</button>`:`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Richtig.':s.help?'Mit Hilfe gelernt.':'Noch einmal üben.'}</b><br>${esc(targets(w).join(' / '))}${!ok?'<br><small>'+esc(vocabExplain(w,answer))+'</small>':''}</div><button class="wide" onclick="next()">Weiter</button>`;}
function update(w,ok){let c=get(w,direction);c={...c};c.seen++;if(ok)c.level=Math.min(c.level+1,5);else{c.level=0;c.errors++}c.due=Date.now()+(ok?[0,600000,86400000,259200000,604800000,1209600000][c.level]:60000);state.cards[key(w,direction)]=c;save()}
function next(){session.index++;show()}
function leave(){if(confirm('Runde beenden? Bereits geübte Wörter bleiben gespeichert.')){if(session.mode==='exam')finish();else home()}}
function finish(){let s=session;if(s.mode==='exam')s.answers.forEach(a=>update(a.w,a.ok));state.sessions++;save();let right=s.answers.filter(a=>a.ok).length,wrong=s.answers.filter(a=>!a.ok);app.innerHTML=`<span class="tag">${s.mode==='exam'?'TESTERGEBNIS':'RUNDE GESCHAFFT'}</span><h1>${right} / ${s.answers.length} richtig</h1><p class="muted">${s.mode==='exam'?'Ohne Hilfe abgefragt.':'Gezählt werden alle Antworten, auch Wiederholungen.'} ${Math.max(1,Math.round((Date.now()-s.started)/60000))} Minuten geübt.</p><div class="card"><h2>${wrong.length?'Diese Wörter brauchen noch Übung':'Gut gemacht.'}</h2>${wrong.map(a=>`<div class="word"><b>${esc(a.w.nl)}</b><span>${esc(a.w.de.join(' / '))}</span><br><small>Deine Antwort: ${esc(a.answer||'Lösung angesehen')}</small></div>`).join('')||'<p class="muted">Komm später wieder: Abrufen mit etwas Abstand hilft beim Behalten.</p>'}</div><div class="row"><button onclick="home()">Übersicht</button>${wrong.length?'<button class="secondary" onclick="start(\'errors\')">Fehler üben</button>':''}</div>`;session=null}
function list(){app.innerHTML=`<button class="ghost" onclick="home()">Zur Übersicht</button><h1>Deine Vokabeln</h1><p class="muted">${pool().length} Einträge aus dem Foto</p><input id="search" placeholder="Wort suchen" aria-label="Wort suchen"><div class="card" id="words"></div>`;let render=()=>{let q=norm(document.getElementById('search').value);document.getElementById('words').innerHTML=pool().filter(w=>norm(w.nl+' '+w.de.join(' ')).includes(q)).map(w=>`<div class="word"><b>${esc(w.nl)}</b><span>${esc(w.de.join(' / '))}</span></div>`).join('')||'<p>Keine Treffer.</p>'};document.getElementById('search').oninput=render;render()}
function editDistance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=0;i<a.length;i++){let next=[i+1];for(let j=0;j<b.length;j++)next.push(Math.min(next[j]+1,row[j+1]+1,row[j]+(a[i]===b[j]?0:1)));row=next}return row[b.length]}
function vocabExplain(w,answer){let correct=targets(w),a=norm(answer);if(direction==='nl'&&/^(de|het) /.test(w.nl)){let [article,...rest]=w.nl.split(' '),noun=rest.join(' ');if(a===norm(noun))return `Das Wort stimmt, aber der Artikel fehlt: ${article} ${noun}.`;if(a===norm((article==='de'?'het':'de')+' '+noun))return `Der Artikel ist vertauscht. Lerne die Verbindung ${w.nl}. De oder het lässt sich nicht sicher aus dem Deutschen ableiten.`;}if(correct.some(t=>norm(t).length>=3&&editDistance(a,norm(t))===1))return 'Fast richtig geschrieben. Vergleiche die Buchstaben mit der Lösung; die Schreibweise zählt mit.';return 'Merke dir Bedeutung, Artikel und Schreibweise. Das Wort kommt wieder.'}
home();
</script></html>
