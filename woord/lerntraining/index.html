let sentenceSession=null;session=null;
if(state.chapterVersion!==4){state.sentences={};delete state.activeRound;state.chapterVersion=4;}state.sentences=state.sentences||{};

home=function(){sentenceSession=null;session=null;app.innerHTML='<span class="tag">DEUTSCH → NIEDERLÄNDISCH</span><h1>Dein Satztrainer</h1><p class="muted">Ganze Sätze übersetzen, wie im Vokabeltest.</p><div class="stats"></div>';const card=document.createElement('section');card.className='card';card.innerHTML='<span class="tag">SATZTRAINER</span><h2>Wie im Vokabeltest</h2><p class="muted">Übersetze ganze deutsche Sätze ins Niederländische. Jeder Satz enthält Vokabeln aus Kapitel 4 „Mijn familie en ik“, gemischt mit bekanntem Wortschatz.</p><label for="sentenceGroup">Vokabelbereich</label><select id="sentenceGroup"><option value="Alle">Alle Bereiche mischen</option>'+[...new Set(SENTENCES.map(s=>s.group))].map(g=>'<option>'+esc(g)+'</option>').join('')+'</select><button class="wide" onclick="startSentences(\'learn\')">In 3 Sätzen üben</button><div class="row" style="margin-top:12px"><button class="secondary" onclick="startSentences(\'exam\')">10-Sätze-Test</button><button class="secondary" onclick="startSentences(\'errors\')">Satzfehler üben</button></div><p class="muted"><small>98 feste Übungssätze. Häufige Varianten wie wij/we werden akzeptiert. Weitere richtige Formulierungen können fehlen.</small></p>';app.insertBefore(card,app.querySelector('.stats'));};
function startSentences(mode){
const g=document.getElementById('sentenceGroup')?.value||'Alle';
let p=SENTENCES.filter(s=>g==='Alle'||s.group===g);
if(mode==='errors')p=p.filter(s=>state.sentences[s.id]?.wrong);
if(!p.length){alert('In diesem Bereich gibt es noch keine Satzfehler.');return;}
sentenceSession={mode,q:shuffle(p).sort((a,b)=>mode==='learn'?(Number(!!state.sentences[b.id]?.wrong)-Number(!!state.sentences[a.id]?.wrong))||((state.sentences[a.id]?.seen||0)-(state.sentences[b.id]?.seen||0)):0).slice(0,mode==='exam'?10:3),i:0,answers:[],graded:false,help:false,finished:false};
session={kind:'sentences'};renderSentence();
}
function renderSentence(){
const s=sentenceSession;if(s.i>=s.q.length)return finishSentences();
s.graded=false;s.help=false;const item=s.q[s.i];
app.innerHTML='<button class="ghost" onclick="leaveSentences()">Runde beenden</button><p>'+ (s.mode==='exam'?'SATZTEST':'SÄTZE ÜBEN')+' · '+(s.i+1)+' / '+s.q.length+'</p><progress value="'+s.i+'" max="'+s.q.length+'"></progress><div class="card"><span class="tag">'+esc(item.group)+'</span><p class="muted">Übersetze den ganzen Satz ins Niederländische.</p><div class="prompt">'+esc(item.de)+'</div><form id="sentenceForm"><label for="sentenceAnswer">Deine Übersetzung</label><input id="sentenceAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Schreibe den ganzen Satz"><button id="sentenceCheck" class="wide">Antwort abgeben</button></form><div id="sentenceFeedback" aria-live="polite"></div>'+(s.mode==='exam'?'':'<button id="sentenceHint" class="ghost" onclick="sentenceHint()">Lösung ansehen</button>')+'</div>';
document.getElementById('sentenceForm').onsubmit=e=>{e.preventDefault();gradeSentence();};
}
function sentenceHint(){const s=sentenceSession;if(s.graded)return;s.help=true;document.getElementById('sentenceFeedback').innerHTML='<div class="feedback">'+esc(s.q[s.i].nl[0])+'<br><small>Mit Hilfe zählt die Antwort als Wiederholung.</small></div>';document.getElementById('sentenceHint').disabled=true;}
function gradeSentence(){
const s=sentenceSession;if(s.graded)return;const input=document.getElementById('sentenceAnswer'),a=input.value;if(!a.trim()&&!s.help){input.focus();return;}
s.graded=true;const item=s.q[s.i],ok=!s.help&&item.nl.some(n=>norm(n)===norm(a));s.answers.push({item,answer:a,ok,help:s.help});
if(!ok && s.mode!=='exam' && !s.q.slice(0,s.i).some(q=>q.id===item.id))s.q.push(item);
input.disabled=true;document.getElementById('sentenceCheck').disabled=true;if(document.getElementById('sentenceHint'))document.getElementById('sentenceHint').disabled=true;
document.getElementById('sentenceFeedback').innerHTML=(s.mode==='exam'?'':'<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'Richtig!':s.help?'Mit Hilfe geübt. Dieser Satz kommt noch einmal.':'Vergleiche mit der Musterlösung.')+'</b><br>'+esc(item.nl[0])+'<br><small>'+esc(item.tip)+'</small></div>')+'<button class="wide" onclick="nextSentence()">Weiter</button>';
}
function nextSentence(){sentenceSession.i++;renderSentence();}
function leaveSentences(){if(confirm('Satzrunde beenden und bisherige Antworten auswerten?'))finishSentences();}
function finishSentences(){
const s=sentenceSession;if(!s||s.finished)return;s.finished=true;
for(const a of s.answers){const old=state.sentences[a.item.id]||{seen:0,wrong:false};state.sentences[a.item.id]={seen:old.seen+1,wrong:!a.ok};}save();
const wrong=s.answers.filter(a=>!a.ok);
app.innerHTML='<span class="tag">SATZERGEBNIS</span><h1>'+s.answers.filter(a=>a.ok).length+' / '+s.answers.length+' richtig</h1><p class="muted">'+(s.mode==='exam'?'Test ohne Hinweise.':'Antworten mit angesehener Lösung zählen als Wiederholung.')+'</p><div class="card">'+(s.answers.length?s.answers.map(a=>'<div class="word"><b>'+esc(a.item.de)+'</b><span>Deine Antwort: '+esc(a.answer||'Lösung angesehen')+'</span><p class="feedback '+(a.ok?'good':'bad')+'">'+(a.ok?'Richtig.':'Musterlösung: '+esc(a.item.nl[0]))+'<br><small>'+esc(a.item.tip)+'</small></p></div>').join(''):'<p>Noch keine Sätze beantwortet.</p>')+'</div><button class="wide" onclick="home()">Zur Übersicht</button>'+(wrong.length?'<p class="muted">Deine Satzfehler sind gespeichert. Du kannst sie auf der Übersicht erneut üben.</p>':'');
}


function persistRound(){
 if(!sentenceSession||sentenceSession.finished){delete state.activeRound;save();return;}
 const input=document.getElementById('sentenceAnswer');
 state.activeRound={round:sentenceSession,html:app.innerHTML,answer:input?input.value:'',scroll:window.scrollY||0};save();
}
const renderSentenceBase=renderSentence;
renderSentence=function(){renderSentenceBase();
const s=sentenceSession;
if(s && !s.finished && s.mode!=='exam'){
 const box=document.getElementById('sentenceFeedback');
 box.insertAdjacentHTML('beforebegin','<div id="support"><button class="secondary" onclick="showWords()">Wörter als Hilfe</button></div>');
}
persistRound();};
function showWords(){
 const s=sentenceSession;if(s.graded)return;

}
